[package]
name = "affidavit-wasm"
version = "26.9.28"
edition = "2021"
rust-version = "1.78"
description = "affidavit as a WebAssembly module: verify, assemble and mine receipt chains through a JSON-over-linear-memory ABI, byte-compatible with `affi`"
license = "MIT OR Apache-2.0"
authors = ["Sean Chatman <xpointsh@gmail.com>"]
repository = "https://github.com/seanchatmangpt/affidavit"
readme = "README.md"
publish = false

[lib]
# cdylib is the deployable .wasm; rlib lets the safe ABI be unit-tested natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Process-mining primitives (DFG, footprint, token replay, log statistics).
# Used as a library: the wasm module re-implements none of them.
affidavit-core = { path = "../affidavit-core" }
# `pure` = portable Rust only, no C/asm, so native and wasm32 agree bit-for-bit.
blake3 = { version = "1", features = ["pure"] }
serde = { version = "1", features = ["derive"] }
# NOTE: do NOT enable serde_json's `preserve_order` feature. Canonical JSON
# relies on `Map` being a BTreeMap (sorted keys); `receipt::tests` guards this.
serde_json = "1"

[dev-dependencies]
wasmi = "1"
wasmi_wasi = "1"

[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package.wasmi]
opt-level = 3
[profile.dev.package.wasmi_core]
opt-level = 3
[profile.dev.package.wasmi_ir]
opt-level = 3
[profile.dev.package.wasmi_collections]
opt-level = 3

# Standalone workspace root, exactly like ../affidavit-core: this crate builds
# and tests on its own and never inherits the root crate's [patch] fences.
[workspace]
