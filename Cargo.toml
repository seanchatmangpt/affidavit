[package]
name = "affidavit"
version = "26.10.5"
edition = "2021"
rust-version = "1.85"
description = "Provenance Layer — receipt assembly and certification, with an optional crypto trust plane (signatures, post-quantum, key custody). Verify a witness against a format standard; never decide honesty."
license = "MIT OR Apache-2.0"
authors = ["Sean Chatman <xpointsh@gmail.com>"]
repository = "https://github.com/seanchatmangpt/affidavit"
homepage = "https://github.com/seanchatmangpt/affidavit"
documentation = "https://docs.rs/affidavit"
readme = "README.md"
keywords = ["provenance", "receipt", "blake3", "signature", "post-quantum"]
categories = ["security", "development-tools", "cryptography"]
exclude = [
  "thesis/",
  "praxis/",
  "tools/",
  "web/",
  "wip/",
  "docs/",
  "reference/",
  "ontology/",
  "nexus_reviews/",
  "*.py",
  ".claude/",
  "scripts/",
  ".ggen/",
  ".ggen-v2/",
  ".github/",
  ".zcode/",
  ".chatmangpt/",
  ".clap-noun-verb/",
  "semconv/",
  "ecosystem/",
  "profiles/",
  "release/",
  "justfile",
  "typos.toml",
  "deny.toml",
  "rust-toolchain.toml",
  "V2030.1.1-PRD-ARD.md",
  # 3.1 MB static corpus; sole consumer is the fuzz test, excluded as a pair.
  "fixtures/crypto_trust_wire_corpus.json",
  "tests/crypto_trust_wire_fuzz.rs",
  # Never-compiled sources. These 17 files live under src/ but are declared in
  # no `mod` and mapped by no `#[path]`, so the compiler never sees them —
  # publishing them would ship 164 KB of code that has never been type-checked
  # as if it were part of the crate. They are kept in the repository (they are
  # the 1000x-initiative drafts and are candidates for future feature gates,
  # see ROADMAP P2-8) but excluded from the package. `orphaned_sources_are_declared_or_excluded`
  # in tests/release_identity.rs holds this list to reality.
  "src/1000x_autonomous_governance.rs",
  "src/1000x_chaos_e2e.rs",
  "src/1000x_cli_telepathy_qol.rs",
  "src/1000x_distributed_sharding.rs",
  "src/1000x_formal_verification_spec.rs",
  "src/1000x_holographic_lsp_dx.rs",
  "src/1000x_nlp_query_qol.rs",
  "src/1000x_otel_hyper_spec.rs",
  "src/1000x_receipt_to_wasm_qol.rs",
  "src/1000x_semantic_isomorphism_e2e.rs",
  "src/1000x_swarm_e2e.rs",
  "src/1000x_tdd_synthesizer_dx.rs",
  "src/1000x_time_travel_dx.rs",
  "src/generation.rs",
  "src/metrics.rs",
  "src/mining.rs",
  "src/mutation.rs",
]

[[bin]]
name = "affi"
path = "src/bin/affi.rs"

[[bin]]
name = "affi-shell"
path = "src/bin/affi-shell.rs"
required-features = ["shell"]

[lib]
name = "affidavit"
path = "src/lib.rs"

[[example]]
name = "verdict_diagnostics"
required-features = ["lsp"]

[[example]]
name = "full_pipeline"
required-features = ["lsp"]

[[example]]
name = "discover_shapeb"
required-features = ["discovery"]

[[example]]
name = "conformance_report"
required-features = ["discovery"]

[[example]]
name = "seal_sj_record"
required-features = ["crypto-trust"]

[[bench]]
name = "receipt_operations"
harness = false
required-features = ["discovery"]

[[bench]]
name = "architecture_receipts"
harness = false

[[bench]]
name = "quality_western_electric"
harness = false
required-features = ["quality-monitor"]

[[bench]]
name = "variance"
harness = false
required-features = ["discovery"]

[dependencies]
# --- CORE INFRASTRUCTURE (Always Mandatory) ---
clap-noun-verb = "26.6"
clap-noun-verb-macros = "26.6"
linkme = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
anyhow = "1"
thiserror = "2"
walkdir = "2"
regex = "1"

# --- FEATURE-GATED ECOSYSTEM INTEGRATIONS ---
# Phase 1: Inspection & catalog
chicago-tdd-tools = { version = "26.6", optional = true }
glob = { version = "0.3", optional = true }

# Phase 2: Process Discovery & LSP
# Pin the current proven compatibility release: this is the structural
# admission/authority vocabulary used by affidavit's court and standing layer.
wasm4pm-compat = { version = "=26.8.7", optional = true }
lsp-max = { version = "26.6", optional = true }
notify = { version = "8", optional = true }

# Phase 3: Mutation & Test Generation
clnrm-core = { version = "1.3", optional = true }
tera = { version = "1", optional = true }
quickcheck = { version = "1", optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }

# Phase 4: Observability (OTel Stack)
opentelemetry = { version = "0.32", features = ["trace", "metrics"], optional = true }
opentelemetry-jaeger = { version = "0.22", optional = true }
opentelemetry-prometheus = { version = "0.13", optional = true }
prometheus = { version = "0.14", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Phase 5: CLI Ergonomics & REPL
rustyline = { version = "12", features = ["derive"], optional = true }
shlex = { version = "2", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
colored = { version = "2", optional = true }
indicatif = { version = "0.17", optional = true }

# Phase 2: Webhook sink for quality violations
reqwest = { version = "0.13", features = ["json"], optional = true }

# Shared Utils
chrono = { version = "0.4", features = ["serde"], optional = true }
hex = { version = "0.4", optional = true }
rayon = { version = "1", optional = true }
criterion = { version = "0.8", optional = true }
rand = { version = "0.8", optional = true }

# --- Cryptographic trust plane (affidavit-trust-plane-pack projections) ---
# Real implementations only: ES256 (RFC 6979 deterministic), ML-DSA-65 (FIPS 204),
# SLH-DSA-SHA2-128s (FIPS 205), hybrid composition at the encoded-bytes level.
signature = { version = "2.2", optional = true }
p256 = { version = "0.13.2", optional = true }
ml-dsa = { version = "0.1.1", optional = true }
slh-dsa = { version = "=0.2.0-rc.5", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }

# --- Advanced witness capability set (accumulator / quorum / ZK / causal DAG) ---
# Sparse Merkle tree state accumulator (BLAKE3): O(log n) inclusion AND absence
# proofs over key-value state claims.
monotree = { version = "0.2", optional = true }
# Bitfield traversal for SMT key paths and footprint matrices.
bitvec = { version = "1.0", default-features = false, features = ["alloc"], optional = true }
# FROST threshold signatures (RFC 9591, Ed25519): t-of-n quorum signing that
# aggregates into one verifiable Schnorr signature.
frost-ed25519 = { version = "2.1", optional = true }
# Classical Ed25519 witness signing/verification (same dalek stack as FROST).
ed25519-dalek = { version = "2.1", default-features = false, features = [
  "alloc",
  "rand_core",
], optional = true }
# Bulletproofs zero-knowledge range proofs (Ristretto): prove a committed
# metric lies in [0, 2^bits) without disclosing the value. Note: bulletproofs
# 4.0 is built on the curve25519-dalek-ng fork, so the scalar/point types in
# this feature come from `-ng`, not from `curve25519-dalek`.
bulletproofs = { version = "4", optional = true }
curve25519-dalek-ng = { version = "4.1", optional = true }
merlin = { version = "3", optional = true }
# Causal DAG certification: Tarjan SCC cycle refusal and topological order.
petgraph = { version = "0.6", default-features = false, features = ["graphmap"], optional = true }
# RFC 8785 JSON Canonicalization Scheme: bit-identical serialization for
# signature preimages across hosts.
serde_jcs = { version = "0.2", optional = true }
# Compact, unambiguous no_std-derived binary envelopes for receipts and proofs.
postcard = { version = "1.0", default-features = false, features = ["alloc"], optional = true }
# Secp256k1 BIP-340 Schnorr + ECDSA witness verification (pure Rust).
k256 = { version = "0.14", default-features = false, features = [
  "ecdsa",
  "schnorr",
  "arithmetic",
  "alloc",
], optional = true }
# BLS signatures over BLS12-381: non-interactive aggregation of many witnesses.
w3f-bls = { version = "0.1", optional = true }
ark-ec = { version = "0.4", default-features = false, optional = true }
ark-bls12-381 = { version = "0.4", features = ["curve"], optional = true }
# Deletable probabilistic membership filter: replay detection / revocation lookups.
cuckoofilter = { version = "0.5", optional = true }
# Compressed bitmaps: contiguity certification over monotonic sequence numbers.
roaring = { version = "0.10", optional = true }
# Canonical RFC 3339 / ISO-8601 parse and emit.
iso8601-timestamp = { version = "0.3", optional = true }
# Zero-copy archival deserialization for large historical receipt stores.
rkyv = { version = "0.8", default-features = false, features = [
  "alloc",
  "pointer_width_32",
  "bytecheck",
], optional = true }
# Sandboxed, fuel-bounded execution of untrusted witness validators (WASM).
wasmtime = { version = "25.0", default-features = false, features = [
  "cranelift",
  "runtime",
  "wat",
], optional = true }
# Formally verified, decidable authority-policy evaluation (AWS Cedar).
cedar-policy = { version = "4.0", optional = true }

# Secure Enclave signing adapter (macOS; Security.framework, non-exportable P-256).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", optional = true }

# GPU Acceleration (1000X)
wgpu = { version = "0.19", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "1.0", optional = true }

# 1000X Innovation Hardening
syn = { version = "3", features = ["full", "visit", "extra-traits", "parsing"], optional = true }
quote = { version = "1", optional = true }
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }
tempfile = { version = "3", optional = true }
# wasm-encoder was a MANDATORY dependency — compiled and linked into every build
# and carried in the published dependency graph — while its only consumer,
# src/1000x_receipt_to_wasm_qol.rs, is declared by no `mod` and therefore never
# compiled. A provenance tool should not ship a supply-chain edge for code that
# does not exist. Re-add it as an optional dependency behind a feature if that
# file is ever wired up (ROADMAP P2-8).
# wasm-encoder = "0.252.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
trybuild = "1"
criterion = { version = "0.8", features = ["html_reports"] }
quickcheck = "1"
quickcheck_macros = "1"
tokio = { version = "1", features = ["full"] }
chicago-tdd-tools = { version = "26.6" }
# Path-only: dev-dependencies without a version are stripped from the published
# package, so crates.io never sees (or resolves) the real `wasm4pm`, whose
# `=0.2.100` wasm-bindgen pin cannot coexist with wgpu 30 (`^0.2.127`) and made
# `cargo publish --dry-run` fail to resolve. Only the local test stub is used.
wasm4pm = { path = "stubs/wasm4pm" }
# Historical local stub exposed synthetic `full`; real v26.8.7 exposes the
# same maximal surface as the three concrete public features below.
wasm4pm-compat = { version = "=26.8.7", features = ["formats", "strict", "wasm4pm"] }
clnrm-core = { version = "1.3" }
# Invariant stress-testing for the advanced witness capability set.
proptest = "1.6"
arbitrary = { version = "1.4", features = ["derive"] }

[features]
# Default feature set
default = ["core"]

# Core Provenance: emit, assemble, verify, show, inspect.
core = ["wasm4pm-compat"]

# Phase 1: Inspection tools (diff, visualize, catalog).
inspection = ["chicago-tdd-tools", "glob", "colored"]

# Phase 2: Process Discovery (model, conform, predict).
# `wasm4pm` is now a plain marker feature (no crates.io dependency behind it): the
# optional dependency was removed so the crate can be published (see
# [dev-dependencies]), but the feature NAME is kept because `cfg(feature =
# "wasm4pm")` gates code and tests. `discovery` was already non-compiling against
# the stub (README, ROADMAP P1-7) and remains so until the real integration is
# admitted and tested.
wasm4pm = []
discovery = ["wasm4pm", "chrono", "hex", "core"]
# Validates receipts against discovered process models.
conformance = ["discovery"]
# Predicts future events based on current receipt state.
predictive = ["conformance"]
# Enables the Language Server Protocol (LSP) for receipt editing.
lsp = ["lsp-max", "tokio"]
# Enables continuous file-watching daemon (Phase 2).
file-watch = ["notify", "shell", "tokio"]

# Phase 3: Mutation Testing and high-volume test generation.
mutation = ["clnrm-core", "tera", "quickcheck", "uuid", "dep:rand"]
# Local storage for test fixtures.
fixture-db = ["chrono"]

# Phase 4: Observability and distributed tracing (OpenTelemetry).
otel = ["opentelemetry", "opentelemetry-jaeger", "tracing", "tracing-subscriber"]
# Metrics collection and Prometheus exporter.
metrics = ["otel", "prometheus", "opentelemetry-prometheus"]

# Phase 5: CLI Ergonomics and interactivity.
# Enables JSON output mode for all CLI verbs.
json-output = []
# Enables the interactive REPL shell.
shell = ["rustyline", "tokio", "shlex"]
# Rich UI elements like progress bars and colors.
ui = ["colored", "indicatif"]

# Extra: Performance & Benchmarking
benchmarking = ["criterion", "rayon"]
# Extended profiling support.
profiling = ["benchmarking"]

# GPU Acceleration for high-throughput verification (1000X).
gpu = ["wgpu", "bytemuck", "pollster"]

# Cryptographic trust plane: keys, custody, canonicalization, signature
# envelopes, signing providers, verification -> cryptographic standing.
# Manufactured from ggen-marketplace affidavit-trust-plane-pack via `ggen sync run`.
crypto-trust = ["dep:signature", "dep:p256", "dep:ml-dsa", "dep:slh-dsa", "dep:rand_core", "ed25519", "secp256k1"]
# Backward-compatible explicit PQC surface used by the exact-head crypto court.
pqc = ["crypto-trust"]
# OPTIONAL certified-receipts upgrade for paid-delivery receipts: signs the
# canonical "affidavit-paid-delivery/v1|<subject>|<payload_hash_hex>" subject
# through the existing certify_signed path. The chain rule itself stays the
# plain sha256 fold; this seam adds signatures, never replaces it, and fails
# OPEN to uncertified (absent feature => module absent => fold-only verify).
certified-receipts = ["crypto-trust"]
# Real Secure Enclave signing (macOS only): non-exportable P-256 keys via
# Security.framework; affidavit owns KeyRef/custody semantics, never key bytes.
secure-enclave = ["crypto-trust", "dep:security-framework"]

# --- Advanced witness capability set (hand-written consumer modules) ---
# Sparse Merkle tree accumulator (monotree, BLAKE3): inclusion + absence proofs
# over key-value state claims; bitvec drives key-path traversal.
smt = ["dep:monotree", "dep:bitvec"]
# FROST threshold quorum certification (RFC 9591, Ed25519): t-of-n signing,
# single aggregate signature verification against the group key.
threshold-quorum = ["dep:frost-ed25519"]
# Zero-knowledge bounded-metric witnesses (bulletproofs range proofs over
# Ristretto): prove 0 <= v < 2^bits without disclosing v.
zk-range = ["dep:bulletproofs", "dep:curve25519-dalek-ng", "dep:merlin", "dep:rand_core"]
# Causal DAG certification (petgraph): Tarjan SCC cycle refusal + topological order.
causal-graph = ["dep:petgraph"]
# RFC 8785 JCS canonical serialization: bit-identical signature preimages.
jcs = ["dep:serde_jcs"]
# Compact binary envelopes (postcard): unambiguous receipt/proof encoding.
binary-envelope = ["dep:postcard"]
# Classical Ed25519 witness signatures (dalek stack shared with FROST).
ed25519 = ["dep:ed25519-dalek"]
# Secp256k1 BIP-340 Schnorr + ECDSA witness verification.
secp256k1 = ["dep:k256"]
# BLS12-381 BLS signatures with non-interactive witness aggregation.
bls = ["dep:w3f-bls", "dep:ark-ec", "dep:ark-bls12-381", "dep:rand"]
# Replay detection / revocation membership (cuckoo filter, deletable).
replay-filter = ["dep:cuckoofilter"]
# Sequence-number contiguity certification (roaring bitmaps).
seq-bitmap = ["dep:roaring"]
# Hybrid logical clocks: causal ordering without wall-clock trust. In-tree
# implementation under a marker feature: `hybrid-logical-clocks` was the
# intended crate but does not exist on crates.io (failed edge, receipt
# 2026-10-03) and a second implementation would not be bought twice.
hlc = []
# Canonical RFC 3339 / ISO-8601 timestamps.
iso8601 = ["dep:iso8601-timestamp"]
# Zero-copy archival access to large historical receipt stores (rkyv).
zero-copy = ["dep:rkyv"]
# Fuel-bounded sandboxed execution of untrusted witness validators (wasmtime).
wasm-court = ["dep:wasmtime"]
# Decidable authority-policy gate (AWS Cedar, Lean-verified semantics).
policy-cedar = ["dep:cedar-policy"]
# Float->Q16.16 quantization seam to the CMCA payoff layout (in-tree;
# consumes wasm4pm-compat's DependencyMeasure content, hence requires core).
quantized-payoff = ["core"]
# Umbrella for the full advanced witness surface.
advanced-crypto = [
  "smt",
  "threshold-quorum",
  "zk-range",
  "causal-graph",
  "jcs",
  "binary-envelope",
  "ed25519",
  "secp256k1",
  "bls",
  "replay-filter",
  "seq-bitmap",
  "hlc",
  "iso8601",
  "zero-copy",
  "wasm-court",
  "policy-cedar",
  "quantized-payoff",
]
# Parallel-session single-file trust plane (unreachable WIP) — gated verbatim, pending consolidation.

# 1000X Innovation Hardening
# Automatic code remediation based on policy violations.
# `tracing` is required: src/1000x_auto_remediate_dx.rs:37 imports it.
remediation = ["syn", "quote", "proc-macro2", "tempfile", "tracing"]
# Post-Quantum Cryptography support.

# Quality monitoring with Western Electric rules
quality-monitor = ["syn", "quote", "shell", "tokio"]

# Phase 2: Webhook sink for quality violations (POST violations to external service)
webhook = ["reqwest", "shell", "tokio"]

# COMBINATORIAL MAXIMALISM: Enables all optional features.
all = [
    "inspection",
    "discovery",
    "conformance",
    "predictive",
    "lsp",
    "file-watch",
    "mutation",
    "fixture-db",
    "otel",
    "metrics",
    "json-output",
    "shell",
    "ui",
    "benchmarking",
    "profiling",
    "gpu",
    "crypto-trust",
    "remediation",
    "quality-monitor",
    "webhook",
    "advanced-crypto"
]

# Development environment: alias for 'all'.
dev = ["all"]

[patch.crates-io]
# Preserve the still-necessary local fence. wasm4pm-compat is deliberately
# NOT patched: v26.8.7 is the current proven structural compatibility release
# and affidavit now consumes its real admission/authority surface directly.
#
# wasm4pm is no longer patched: it is a path-only dev-dependency on
# stubs/wasm4pm (see [dev-dependencies]), so there is nothing on crates.io to
# patch and the published package carries no edge to the real crate.
#
# clnrm-core — version "1.3" in Cargo.toml vs "26.5.x" upstream. The real repo
# pulls in a large transitive surface for an optional mutation feature; keep the
# bounded stub until that version/feature boundary is intentionally graduated.
clnrm-core = { path = "stubs/clnrm-core" }

# CI/test latency: optimize crypto dependency compute without changing first-party dev checks.
[profile.dev.package.ml-dsa]
opt-level = 3
[profile.dev.package.slh-dsa]
opt-level = 3
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha3]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.keccak]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bench]]
name = "crypto_trust_bench"
harness = false
required-features = ["crypto-trust"]
