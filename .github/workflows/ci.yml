name: CI

on:
  push:
    branches: ["main", "claude/*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout affidavit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: affidavit

      - name: Clone companion repos
        # Provenance-only siblings. Build uses crates.io + stubs/; a shallow
        # clone that cannot detach the pinned SHA must not fail the job.
        run: |
          set +e
          cd ..
          clone_pin() {
            local repo="$1" sha="$2"
            git clone --depth 1 "https://github.com/seanchatmangpt/${repo}.git" || {
              echo "WARN: clone ${repo} failed; continuing (crates.io/stubs cover build)"
              return 0
            }
            if ! git -C "$repo" fetch --depth 1 origin "$sha" 2>/dev/null; then
              echo "WARN: fetch ${repo}@${sha} outside shallow tip; continuing"
              return 0
            fi
            if ! git -C "$repo" checkout --detach "$sha"; then
              echo "WARN: checkout ${repo}@${sha} failed; continuing"
              return 0
            fi
            echo "pinned: ${repo}@${sha}"
          }
          clone_pin clap-noun-verb 747f1dd4506892c218da4d739c256bcfcf941e50
          clone_pin wasm4pm-compat 4c523e0d81a5bb52fda21cea992201f608e088b5
          # wasm4pm / chicago-tdd-tools / clnrm-core: stubs via [patch.crates-io]
          clone_pin lsp-max 5dec93bef12592b2d7eee7b9a45139595f2bbedb
          exit 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            affidavit/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('affidavit/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        working-directory: affidavit
        run: cargo build --all-targets

      - name: Build with otel feature
        working-directory: affidavit
        run: cargo build --lib --features otel

      - name: Run library tests
        working-directory: affidavit
        run: cargo test --lib

      - name: Run integration tests
        working-directory: affidavit
        run: cargo test --tests

      - name: Run examples (build only)
        working-directory: affidavit
        run: cargo build --examples

  lint:
    name: Lint (clippy + fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout affidavit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: affidavit

      - name: Clone companion repos
        # Provenance-only siblings. Build uses crates.io + stubs/; a shallow
        # clone that cannot detach the pinned SHA must not fail the job.
        run: |
          set +e
          cd ..
          clone_pin() {
            local repo="$1" sha="$2"
            git clone --depth 1 "https://github.com/seanchatmangpt/${repo}.git" || {
              echo "WARN: clone ${repo} failed; continuing (crates.io/stubs cover build)"
              return 0
            }
            if ! git -C "$repo" fetch --depth 1 origin "$sha" 2>/dev/null; then
              echo "WARN: fetch ${repo}@${sha} outside shallow tip; continuing"
              return 0
            fi
            if ! git -C "$repo" checkout --detach "$sha"; then
              echo "WARN: checkout ${repo}@${sha} failed; continuing"
              return 0
            fi
            echo "pinned: ${repo}@${sha}"
          }
          clone_pin clap-noun-verb 747f1dd4506892c218da4d739c256bcfcf941e50
          clone_pin wasm4pm-compat 4c523e0d81a5bb52fda21cea992201f608e088b5
          # wasm4pm / chicago-tdd-tools / clnrm-core: stubs via [patch.crates-io]
          clone_pin lsp-max 5dec93bef12592b2d7eee7b9a45139595f2bbedb
          exit 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            affidavit/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('affidavit/Cargo.lock') }}

      - name: Check formatting
        working-directory: affidavit
        run: cargo fmt --check

      - name: Run clippy
        working-directory: affidavit
        run: cargo clippy --all-targets -- -D warnings

  benchmarks:
    name: Benchmarks (compile check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout affidavit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: affidavit

      - name: Clone companion repos
        # Provenance-only siblings. Build uses crates.io + stubs/; a shallow
        # clone that cannot detach the pinned SHA must not fail the job.
        run: |
          set +e
          cd ..
          clone_pin() {
            local repo="$1" sha="$2"
            git clone --depth 1 "https://github.com/seanchatmangpt/${repo}.git" || {
              echo "WARN: clone ${repo} failed; continuing (crates.io/stubs cover build)"
              return 0
            }
            if ! git -C "$repo" fetch --depth 1 origin "$sha" 2>/dev/null; then
              echo "WARN: fetch ${repo}@${sha} outside shallow tip; continuing"
              return 0
            fi
            if ! git -C "$repo" checkout --detach "$sha"; then
              echo "WARN: checkout ${repo}@${sha} failed; continuing"
              return 0
            fi
            echo "pinned: ${repo}@${sha}"
          }
          clone_pin clap-noun-verb 747f1dd4506892c218da4d739c256bcfcf941e50
          clone_pin wasm4pm-compat 4c523e0d81a5bb52fda21cea992201f608e088b5
          # wasm4pm / chicago-tdd-tools / clnrm-core: stubs via [patch.crates-io]
          clone_pin lsp-max 5dec93bef12592b2d7eee7b9a45139595f2bbedb
          exit 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            affidavit/target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('affidavit/Cargo.lock') }}

      - name: Compile benchmarks
        working-directory: affidavit
        run: cargo build --benches
