name: CI

on:
  push:
    branches: ["main", "claude/*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout affidavit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: affidavit

      # No companion clones: the manifest resolves entirely from crates.io plus
      # in-repo stubs/ and vendor/. The former depth-1 clones checked out pinned
      # SHAs outside their fetched history ("fatal: unable to read tree") and
      # failed every job before cargo ran.

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            affidavit/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('affidavit/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        working-directory: affidavit
        run: cargo build --all-targets

      - name: Build with otel feature
        working-directory: affidavit
        run: cargo build --lib --features otel

      - name: Run library tests
        working-directory: affidavit
        run: cargo test --lib

      - name: Run integration tests
        working-directory: affidavit
        run: cargo test --tests

      - name: Run examples (build only)
        working-directory: affidavit
        run: cargo build --examples

  lint:
    name: Lint (clippy + fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout affidavit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: affidavit

      # No companion clones: the manifest resolves entirely from crates.io plus
      # in-repo stubs/ and vendor/. The former depth-1 clones checked out pinned
      # SHAs outside their fetched history ("fatal: unable to read tree") and
      # failed every job before cargo ran.

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            affidavit/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('affidavit/Cargo.lock') }}

      - name: Check formatting
        working-directory: affidavit
        run: cargo fmt --check

      - name: Run clippy
        working-directory: affidavit
        run: cargo clippy --all-targets -- -D warnings

  benchmarks:
    name: Benchmarks (compile check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout affidavit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: affidavit

      # No companion clones: the manifest resolves entirely from crates.io plus
      # in-repo stubs/ and vendor/. The former depth-1 clones checked out pinned
      # SHAs outside their fetched history ("fatal: unable to read tree") and
      # failed every job before cargo ran.

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            affidavit/target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('affidavit/Cargo.lock') }}

      - name: Compile benchmarks
        working-directory: affidavit
        run: cargo build --benches
