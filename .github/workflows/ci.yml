name: CI

on:
  push:
    branches: ["main", "claude/*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout affidavit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: affidavit

      - name: Clone companion repos
        run: |
          cd ..
          # Companion clones are provenance-only path siblings, pinned to a
          # full 40-hex SHA at pinning time; a moving default-branch HEAD would
          # make CI non-reproducible.
          git clone --depth 1 https://github.com/seanchatmangpt/clap-noun-verb.git
          git -C clap-noun-verb checkout --detach 747f1dd4506892c218da4d739c256bcfcf941e50 # pinned: clap-noun-verb@747f1dd4506892c218da4d739c256bcfcf941e50
          git clone --depth 1 https://github.com/seanchatmangpt/wasm4pm-compat.git
          git -C wasm4pm-compat checkout --detach 4c523e0d81a5bb52fda21cea992201f608e088b5 # pinned: wasm4pm-compat@4c523e0d81a5bb52fda21cea992201f608e088b5
          git clone --depth 1 https://github.com/seanchatmangpt/wasm4pm.git
          git -C wasm4pm checkout --detach a7352d818dbcaa15909833f13ac367dc5950a7a9 # pinned: wasm4pm@a7352d818dbcaa15909833f13ac367dc5950a7a9
          git clone --depth 1 https://github.com/seanchatmangpt/chicago-tdd-tools.git
          git -C chicago-tdd-tools checkout --detach 5edb69355d0b5fc933ae602aee0dfb151864070e # pinned: chicago-tdd-tools@5edb69355d0b5fc933ae602aee0dfb151864070e
          git clone --depth 1 https://github.com/seanchatmangpt/clnrm.git
          git -C clnrm checkout --detach 15d26873d7a0c9e32bffc456a4a90bd7ce355225 # pinned: clnrm@15d26873d7a0c9e32bffc456a4a90bd7ce355225
          git clone --depth 1 https://github.com/seanchatmangpt/lsp-max.git
          git -C lsp-max checkout --detach 5dec93bef12592b2d7eee7b9a45139595f2bbedb # pinned: lsp-max@5dec93bef12592b2d7eee7b9a45139595f2bbedb

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            affidavit/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('affidavit/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        working-directory: affidavit
        run: cargo build --all-targets

      - name: Build with otel feature
        working-directory: affidavit
        run: cargo build --lib --features otel

      - name: Run library tests
        working-directory: affidavit
        run: cargo test --lib

      - name: Run integration tests
        working-directory: affidavit
        run: cargo test --tests

      - name: Run examples (build only)
        working-directory: affidavit
        run: cargo build --examples

  lint:
    name: Lint (clippy + fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout affidavit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: affidavit

      - name: Clone companion repos
        run: |
          cd ..
          # Companion clones are provenance-only path siblings, pinned to a
          # full 40-hex SHA at pinning time; a moving default-branch HEAD would
          # make CI non-reproducible.
          git clone --depth 1 https://github.com/seanchatmangpt/clap-noun-verb.git
          git -C clap-noun-verb checkout --detach 747f1dd4506892c218da4d739c256bcfcf941e50 # pinned: clap-noun-verb@747f1dd4506892c218da4d739c256bcfcf941e50
          git clone --depth 1 https://github.com/seanchatmangpt/wasm4pm-compat.git
          git -C wasm4pm-compat checkout --detach 4c523e0d81a5bb52fda21cea992201f608e088b5 # pinned: wasm4pm-compat@4c523e0d81a5bb52fda21cea992201f608e088b5
          git clone --depth 1 https://github.com/seanchatmangpt/wasm4pm.git
          git -C wasm4pm checkout --detach a7352d818dbcaa15909833f13ac367dc5950a7a9 # pinned: wasm4pm@a7352d818dbcaa15909833f13ac367dc5950a7a9
          git clone --depth 1 https://github.com/seanchatmangpt/chicago-tdd-tools.git
          git -C chicago-tdd-tools checkout --detach 5edb69355d0b5fc933ae602aee0dfb151864070e # pinned: chicago-tdd-tools@5edb69355d0b5fc933ae602aee0dfb151864070e
          git clone --depth 1 https://github.com/seanchatmangpt/clnrm.git
          git -C clnrm checkout --detach 15d26873d7a0c9e32bffc456a4a90bd7ce355225 # pinned: clnrm@15d26873d7a0c9e32bffc456a4a90bd7ce355225
          git clone --depth 1 https://github.com/seanchatmangpt/lsp-max.git
          git -C lsp-max checkout --detach 5dec93bef12592b2d7eee7b9a45139595f2bbedb # pinned: lsp-max@5dec93bef12592b2d7eee7b9a45139595f2bbedb

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            affidavit/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('affidavit/Cargo.lock') }}

      - name: Check formatting
        working-directory: affidavit
        run: cargo fmt --check

      - name: Run clippy
        working-directory: affidavit
        run: cargo clippy --all-targets -- -D warnings

  benchmarks:
    name: Benchmarks (compile check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout affidavit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: affidavit

      - name: Clone companion repos
        run: |
          cd ..
          # Companion clones are provenance-only path siblings, pinned to a
          # full 40-hex SHA at pinning time; a moving default-branch HEAD would
          # make CI non-reproducible.
          git clone --depth 1 https://github.com/seanchatmangpt/clap-noun-verb.git
          git -C clap-noun-verb checkout --detach 747f1dd4506892c218da4d739c256bcfcf941e50 # pinned: clap-noun-verb@747f1dd4506892c218da4d739c256bcfcf941e50
          git clone --depth 1 https://github.com/seanchatmangpt/wasm4pm-compat.git
          git -C wasm4pm-compat checkout --detach 4c523e0d81a5bb52fda21cea992201f608e088b5 # pinned: wasm4pm-compat@4c523e0d81a5bb52fda21cea992201f608e088b5
          git clone --depth 1 https://github.com/seanchatmangpt/wasm4pm.git
          git -C wasm4pm checkout --detach a7352d818dbcaa15909833f13ac367dc5950a7a9 # pinned: wasm4pm@a7352d818dbcaa15909833f13ac367dc5950a7a9
          git clone --depth 1 https://github.com/seanchatmangpt/chicago-tdd-tools.git
          git -C chicago-tdd-tools checkout --detach 5edb69355d0b5fc933ae602aee0dfb151864070e # pinned: chicago-tdd-tools@5edb69355d0b5fc933ae602aee0dfb151864070e
          git clone --depth 1 https://github.com/seanchatmangpt/clnrm.git
          git -C clnrm checkout --detach 15d26873d7a0c9e32bffc456a4a90bd7ce355225 # pinned: clnrm@15d26873d7a0c9e32bffc456a4a90bd7ce355225
          git clone --depth 1 https://github.com/seanchatmangpt/lsp-max.git
          git -C lsp-max checkout --detach 5dec93bef12592b2d7eee7b9a45139595f2bbedb # pinned: lsp-max@5dec93bef12592b2d7eee7b9a45139595f2bbedb

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            affidavit/target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('affidavit/Cargo.lock') }}

      - name: Compile benchmarks
        working-directory: affidavit
        run: cargo build --benches
