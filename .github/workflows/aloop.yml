# aloop.yml — ALOOP ExecutionReceipt profile + ZeroUnreceiptedActuation falsifiers.
#
# Self-contained (Python + jsonschema only; no sibling PATH crates). Runs the Chicago
# pytest suite (golden-projection drift guard, profile conformance, adversarial corpus,
# CPU-time benchmark regression bound) and the tool's own self-test.
# The vendored-schema sync guard skips the ~/.zcode twin checks on a runner that does
# not have them and still checks profile-inline == vendored.
name: aloop

on:
  push:
    branches: [main]
    paths:
      - "tools/aloop_falsifiers.py"
      - "tools/check_dfcm_schema_sync.py"
      - "tools/tests/**"
      - "tools/bench/**"
      - "tools/requirements-ci.txt"
      - "schemas/**"
      - "fixtures/aloop/**"
      - ".github/workflows/aloop.yml"
  pull_request:
    paths:
      - "tools/aloop_falsifiers.py"
      - "tools/check_dfcm_schema_sync.py"
      - "tools/tests/**"
      - "tools/bench/**"
      - "tools/requirements-ci.txt"
      - "schemas/**"
      - "fixtures/aloop/**"
      - ".github/workflows/aloop.yml"

concurrency:
  group: aloop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  falsifiers:
    name: aloop falsifiers (pytest + self-test + bench bound)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - name: Install test deps
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
      - name: Schema sync guard
        run: python tools/check_dfcm_schema_sync.py
      - name: Falsifier self-test
        run: python tools/aloop_falsifiers.py self-test
      - name: Golden case check
        run: python tools/aloop_falsifiers.py check fixtures/aloop/golden_case
      - name: Pytest (Chicago, no doubles)
        run: python -m pytest tools/tests -q
