# affidavit-wasm.yml — the WebAssembly module lane.
#
# affidavit-wasm/ is a standalone crate (not a root workspace member) that ships
# affidavit's verifier as a .wasm with a JSON-over-linear-memory ABI. The lane
# builds the real module, then drives it in a real wasm runtime (wasmi) against
# fixtures produced by the real `affi` binary. Every step blocks.
#
# Toolchain: the repo-root rust-toolchain.toml pins an exact nightly and
# affidavit-wasm/ inherits it, so the wasm target is added to *that* toolchain
# (working-directory below), not to a floating one.
name: affidavit-wasm

on:
  push:
    branches: [main]
    paths:
      - "affidavit-wasm/**"
      - "affidavit-core/**"
      - "ontology/affi-wasm.ttl"
      - "ggen.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/affidavit-wasm.yml"
  pull_request:
    paths:
      - "affidavit-wasm/**"
      - "affidavit-core/**"
      - "ontology/affi-wasm.ttl"
      - "ggen.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/affidavit-wasm.yml"
  release:
    types: [published]

concurrency:
  group: affidavit-wasm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: affidavit-wasm

jobs:
  wasm:
    name: affidavit-wasm (build + real-runtime tests + clippy + fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain (rustfmt, clippy) + wasm32-wasip1
        run: |
          set -euo pipefail
          # `rustup show` materializes the toolchain named by rust-toolchain.toml.
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-wasip1

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: affidavit-wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Registry drift court (ggen sync must reproduce the committed projections)
        # ffi.rs, abi_meta.rs, .cargo/config.toml and registry/* are rendered from
        # ontology/affi-wasm.ttl by the wasi-json-abi-pack. ARTIFACTS.sha256 is a
        # create-only pin and is never overwritten by sync.
        working-directory: .
        run: |
          set -euo pipefail
          ggen sync run
          git diff --exit-code -- affidavit-wasm/registry affidavit-wasm/src/ffi.rs \
            affidavit-wasm/src/abi_meta.rs affidavit-wasm/.cargo/config.toml

      - name: cargo fmt --check
        run: cargo fmt -- --check

      - name: cargo clippy (native, all targets)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo clippy (wasm32-wasip1 — compiles the unsafe FFI shell)
        run: cargo clippy --locked --lib --target wasm32-wasip1 -- -D warnings

      - name: Native unit tests (safe ABI)
        run: cargo test --locked --lib

      - name: Build the WASI module
        run: cargo build --locked --lib --target wasm32-wasip1 --profile wasm

      - name: Double-build identity (same source, separate target dir => identical bytes)
        run: |
          set -euo pipefail
          cargo build --locked --lib --target wasm32-wasip1 --profile wasm \
            --target-dir "$RUNNER_TEMP/wasm-second"
          cmp target/wasm32-wasip1/wasm/affidavit_wasm.wasm \
              "$RUNNER_TEMP/wasm-second/wasm32-wasip1/wasm/affidavit_wasm.wasm"

      - name: Drive the compiled module in a real wasm runtime (differential, registry, pin)
        env:
          AFFIDAVIT_WASM: ${{ github.workspace }}/affidavit-wasm/target/wasm32-wasip1/wasm/affidavit_wasm.wasm
        # wasm_abi (parity with affi), op_differential (native == wasm over every
        # op example), registry_artifacts (registry == module, sha256 pin).
        run: cargo test --locked --test wasm_abi --test op_differential --test registry_artifacts

      - name: Docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps

      - name: Checksum (must equal the pin in registry/ARTIFACTS.sha256)
        run: |
          set -euo pipefail
          cd target/wasm32-wasip1/wasm
          cp affidavit_wasm.wasm affidavit.wasm
          sha256sum affidavit.wasm | tee affidavit.wasm.sha256
          pinned="$(awk '$1=="wasm" && length($2)==64 {print $2}' ../../../registry/ARTIFACTS.sha256)"
          test -z "$pinned" || test "$pinned" = "$(cut -d' ' -f1 affidavit.wasm.sha256)"

      - name: Upload WASI module
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: affidavit-wasm
          path: |
            affidavit-wasm/target/wasm32-wasip1/wasm/affidavit.wasm
            affidavit-wasm/target/wasm32-wasip1/wasm/affidavit.wasm.sha256

  attach:
    # Least privilege: only this job can write to the release, and it only runs
    # for a published release after every check above has passed.
    name: attach module to release
    needs: wasm
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download the verified module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: affidavit-wasm
          path: dist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The artifact keeps the workspace-relative layout; locate the files.
          wasm="$(find dist -name affidavit.wasm | head -n1)"
          sum="$(find dist -name affidavit.wasm.sha256 | head -n1)"
          test -n "$wasm" && test -n "$sum"
          gh release upload "${{ github.event.release.tag_name }}" "$wasm" "$sum" \
            --clobber --repo "$GITHUB_REPOSITORY"
