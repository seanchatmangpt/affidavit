# rust.yml — exact-head courts for the root `affidavit` crate.
#
# The real published wasm4pm-compat v26.8.7 edge is admitted here; wasm4pm and
# clnrm-core remain explicit local fences. Every PR job executes the immutable PR
# head, not GitHub's synthetic merge commit. Cargo's resolver-produced lockfile
# is preserved even when compilation fails so dependency replay can be repaired
# without hand-editing the lock.
name: rust

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "benches/**"
      - "examples/**"
      - "scripts/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "benches/**"
      - "examples/**"
      - "scripts/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RUST_TOOLCHAIN: nightly-2026-08-12

jobs:
  fmt:
    name: rustfmt (cargo fmt --check)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Assert exact candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install pinned nightly Rust with rustfmt
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: cargo fmt --all --check
        run: cargo fmt --all -- --check

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Assert exact candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo build --all-targets
        run: cargo build --all-targets

      - name: Upload resolver-produced Cargo.lock
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolved-cargo-lock-${{ env.CANDIDATE_SHA }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 3

      - name: cargo test --all-targets (unit + integration + example/bench harnesses)
        run: cargo test --all-targets

      - name: cargo test --doc (doctests)
        run: cargo test --doc

  clippy:
    name: clippy (cargo clippy --all-targets -D warnings)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Assert exact candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install pinned nightly toolchain with clippy
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

  crypto-trust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Assert exact candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Render trust-plane projections (drift court)
        run: ggen sync run && git diff --exit-code src/crypto_trust_*.rs tests/crypto_trust_e2e.rs

      - name: cargo test --features crypto-trust
        run: cargo test --features crypto-trust --all-targets

      - name: cargo clippy --features crypto-trust -- -D warnings
        run: cargo clippy --features crypto-trust --all-targets -- -D warnings

  # Machine-relative drift alarm: re-runs the real criterion suite with the
  # settings docs/CRYPTO_TRUST_PLANE.md was recorded with and refuses any
  # median >10x the recorded number (faster is never a failure). Runs after
  # the test courts; never soft-fails.
  perf-budget:
    name: perf-budget (crypto-trust 10x recorded-median drift alarm)
    runs-on: ubuntu-24.04
    needs: build-and-test
    continue-on-error: false
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Assert exact candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo build --all-targets --features crypto-trust
        run: cargo build --all-targets --features crypto-trust

      - name: Performance budget check (10x recorded-median drift alarm)
        run: scripts/perf_budget_check.sh

  # Secure Enclave requires Apple silicon / macOS: security-framework only links
  # here, so this is the job where the feature gate is actually exercised.
  # The enclave live KAT is #[ignore]-gated (needs operator biometrics, device
  # passcode, and an entitlement-signed binary — OSStatus -34018 for unsigned
  # CLIs); CI therefore runs the NON-ignored suite only via plain `cargo test`
  # and never attempts interactive keychain access.
  crypto-trust-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Assert exact candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo test --features secure-enclave --all-targets (non-ignored suite)
        run: cargo test --features secure-enclave --all-targets

      - name: cargo clippy --features secure-enclave -- -D warnings
        run: cargo clippy --features secure-enclave --all-targets -- -D warnings
