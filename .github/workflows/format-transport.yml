# One-shot bounded formatter transport for PR #50.
# This branch is not a product surface. It exists only because the current local
# runtime cannot resolve github.com; the workflow manufactures a formatter-only
# tree using the same pinned nightly as the blocking Rust court.
name: format-transport

on:
  push:
    branches:
      - agent/format-transport-20260812
    paths:
      - ".github/workflows/format-transport.yml"

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: nightly-2026-08-12
  SOURCE_SHA: 31d5feea4c5e759a6431ee9f9f4433cadd187235
  RESULT_BRANCH: agent/format-result-20260812

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact transport candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Assert source parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"

      - name: Install pinned rustfmt
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Apply pinned rustfmt
        run: cargo fmt --all

      - name: Bound formatter closure
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          observed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            src/errc.rs \
            src/errc_claim_assurance.rs \
            src/lib.rs \
            tests/reference_powl_build.rs \
            tests/reference_powl_invalid_loop.rs | sort)"
          printf 'observed formatter paths:\n%s\n' "$observed"
          test "$observed" = "$expected"

      - name: Manufacture formatter-only result tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/errc.rs \
            src/errc_claim_assurance.rs \
            src/lib.rs \
            tests/reference_powl_build.rs \
            tests/reference_powl_invalid_loop.rs
          git rm .github/workflows/format-transport.yml
          git commit -m "style: apply pinned rustfmt closure"
          git push origin "HEAD:refs/heads/$RESULT_BRANCH"
